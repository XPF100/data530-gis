<svg xmlns="http://www.w3.org/2000/svg" role="img" width="760" height="300" viewBox="0 0 760 300"><title>Location quotient: a tract with 30% of a group where the study area has 10% has LQ 3; a tract with 5% has LQ 0.5</title><rect width="760" height="300" fill="#FFFFFF"/><rect x="80" y="200" width="140" height="60" fill="#D5E8E4"/><rect x="300" y="80" width="140" height="180" fill="#1B7F79"/><rect x="520" y="230" width="140" height="30" fill="#F5DDC2"/><line x1="60" y1="260" x2="700" y2="260" stroke="#45535C" stroke-width="3"/><line x1="60" y1="200" x2="700" y2="200" stroke="#D9822B" stroke-width="3" stroke-dasharray="10 8"/><text x="150" y="285" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#1E2B33" text-anchor="middle">Study area 10%</text><text x="370" y="285" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#1E2B33" text-anchor="middle">Tract A 30%</text><text x="590" y="285" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#1E2B33" text-anchor="middle">Tract B 5%</text><text x="370" y="60" font-family="Public Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2B33" text-anchor="middle">LQ = 3.0</text><text x="590" y="180" font-family="Public Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2B33" text-anchor="middle">LQ = 0.5</text><text x="150" y="180" font-family="Public Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2B33" text-anchor="middle">LQ = 1</text></svg>