<svg xmlns="http://www.w3.org/2000/svg" role="img" width="820" height="260" viewBox="0 0 820 260"><title>Gravity model: two large, close places have a thick flow line between them; two small, distant places have a thin one</title><rect width="820" height="320" fill="#FFFFFF"/><circle cx="110" cy="90" r="60" fill="#1B7F79"/><circle cx="330" cy="90" r="60" fill="#1B7F79"/><line x1="170" y1="90" x2="270" y2="90" stroke="#D9822B" stroke-width="22" stroke-linecap="round"/><circle cx="470" cy="90" r="24" fill="#1B7F79"/><circle cx="780" cy="90" r="24" fill="#1B7F79"/><line x1="494" y1="90" x2="756" y2="90" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><text x="220" y="200" font-family="Public Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2B33" text-anchor="middle">Large and close</text><text x="220" y="232" font-family="Public Sans, Arial, sans-serif" font-size="20" fill="#45535C" text-anchor="middle">big flow</text><text x="625" y="200" font-family="Public Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2B33" text-anchor="middle">Small and far</text><text x="625" y="232" font-family="Public Sans, Arial, sans-serif" font-size="20" fill="#45535C" text-anchor="middle">small flow</text></svg>