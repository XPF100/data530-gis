<svg xmlns="http://www.w3.org/2000/svg" role="img" width="820" height="300" viewBox="0 0 820 300"><title>Push factors at the origin and pull factors at the destination, with intervening obstacles such as distance, cost and borders in between</title><rect width="820" height="300" fill="#FFFFFF"/><circle cx="140" cy="150" r="100" fill="#D5E8E4"/><circle cx="680" cy="150" r="100" fill="#F5DDC2"/><rect x="385" y="60" width="50" height="180" rx="8" fill="#45535C"/><line x1="250" y1="150" x2="363" y2="150" stroke="#1B7F79" stroke-width="12" stroke-linecap="round"/><path d="M375,150 L355,160 L355,140 Z" fill="#1B7F79"/><line x1="445" y1="150" x2="558" y2="150" stroke="#1B7F79" stroke-width="12" stroke-linecap="round"/><path d="M570,150 L550,160 L550,140 Z" fill="#1B7F79"/><text x="140" y="140" font-family="Public Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2B33" text-anchor="middle">Origin</text><text x="140" y="172" font-family="Public Sans, Arial, sans-serif" font-size="20" fill="#45535C" text-anchor="middle">push factors</text><text x="680" y="140" font-family="Public Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2B33" text-anchor="middle">Destination</text><text x="680" y="172" font-family="Public Sans, Arial, sans-serif" font-size="20" fill="#45535C" text-anchor="middle">pull factors</text><text x="410" y="275" font-family="Public Sans, Arial, sans-serif" font-size="20" fill="#45535C" text-anchor="middle">intervening obstacles</text></svg>