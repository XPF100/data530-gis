<svg xmlns="http://www.w3.org/2000/svg" role="img" width="460" height="400" viewBox="0 0 460 400"><title>World systems theory: a wealthy core, a semi-periphery of lower-wage manufacturing, and a periphery that exports raw materials</title><rect width="460" height="400" fill="#FFFFFF"/><circle cx="230" cy="200" r="180" fill="#F5DDC2"/><circle cx="230" cy="200" r="115" fill="#D5E8E4"/><circle cx="230" cy="200" r="55" fill="#1B7F79"/><text x="230" y="207" font-family="Public Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#F7F5EF" text-anchor="middle">Core</text><text x="230" y="120" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2B33" text-anchor="middle">Semi-periphery</text><text x="230" y="50" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2B33" text-anchor="middle">Periphery</text></svg>