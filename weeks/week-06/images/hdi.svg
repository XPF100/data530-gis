<svg xmlns="http://www.w3.org/2000/svg" role="img" width="860" height="270" viewBox="0 0 860 270"><title>The Human Development Index combines three dimensions: health (life expectancy), education (years of schooling) and income (GNI per capita in PPP)</title><rect width="860" height="320" fill="#FFFFFF"/><rect x="20" y="30" width="190" height="110" rx="14" fill="#D5E8E4"/><text x="115" y="75" font-family="Public Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2B33" text-anchor="middle">Health</text><text x="115" y="106" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#45535C" text-anchor="middle">Life expectancy at</text><text x="115" y="126" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#45535C" text-anchor="middle">birth</text><path d="M115 140 L115 190 L700 190" fill="none" stroke="#D9822B" stroke-width="5"/><rect x="230" y="30" width="190" height="110" rx="14" fill="#D5E8E4"/><text x="325" y="75" font-family="Public Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2B33" text-anchor="middle">Education</text><text x="325" y="106" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#45535C" text-anchor="middle">Mean and expected</text><text x="325" y="126" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#45535C" text-anchor="middle">years of schooling</text><path d="M325 140 L325 190 L700 190" fill="none" stroke="#D9822B" stroke-width="5"/><rect x="440" y="30" width="190" height="110" rx="14" fill="#D5E8E4"/><text x="535" y="75" font-family="Public Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2B33" text-anchor="middle">Income</text><text x="535" y="106" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#45535C" text-anchor="middle">GNI per capita</text><text x="535" y="126" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#45535C" text-anchor="middle">(PPP)</text><path d="M535 140 L535 190 L700 190" fill="none" stroke="#D9822B" stroke-width="5"/><rect x="680" y="140" width="160" height="110" rx="14" fill="#1B7F79"/><text x="760" y="192" font-family="Public Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#F7F5EF" text-anchor="middle">HDI</text><text x="760" y="225" font-family="Public Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#F7F5EF" text-anchor="middle">0 to 1</text></svg>