<svg xmlns="http://www.w3.org/2000/svg" role="img" width="380" height="380" viewBox="0 0 380 380"><title>Bivariate legend: a 3 by 3 grid where one colour ramp shows travel time and the other shows poverty; the darkest corner marks areas high on both</title><rect width="380" height="380" fill="#FFFFFF"/><rect x="90" y="210" width="78" height="78" fill="#EEF0E6"/><rect x="170" y="210" width="78" height="78" fill="#B7DCD5"/><rect x="250" y="210" width="78" height="78" fill="#1B7F79"/><rect x="90" y="130" width="78" height="78" fill="#F5DDC2"/><rect x="170" y="130" width="78" height="78" fill="#C9C2A6"/><rect x="250" y="130" width="78" height="78" fill="#4F8577"/><rect x="90" y="50" width="78" height="78" fill="#D9822B"/><rect x="170" y="50" width="78" height="78" fill="#A2683B"/><rect x="250" y="50" width="78" height="78" fill="#1E2B33"/><path d="M80 300 L340 300" stroke="#45535C" stroke-width="3"/><path d="M340 300 l-14 -8 l0 16 z" fill="#45535C"/><path d="M80 300 L80 40" stroke="#45535C" stroke-width="3"/><path d="M80 40 l-8 14 l16 0 z" fill="#45535C"/><text x="210" y="335" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14605B" text-anchor="middle">travel time to clinic →</text><text x="45" y="170" font-family="Public Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A4A12" text-anchor="middle" transform="rotate(-90 45 170)">poverty →</text></svg>