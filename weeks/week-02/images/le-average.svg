<svg xmlns="http://www.w3.org/2000/svg" role="img" width="760" height="180" viewBox="0 0 760 180"><title>Five deaths at ages 1, 19, 56, 79 and 95 average 50, pulled down by the infant death</title><rect width="760" height="180" fill="#FFFFFF"/><line x1="40" y1="100" x2="724" y2="100" stroke="#B9A47F" stroke-width="3"/><line x1="400" y1="40" x2="400" y2="150" stroke="#D9822B" stroke-width="5"/><text x="400" y="30" font-family="Public Sans, Arial, sans-serif" font-size="22" fill="#8A4A12" text-anchor="middle" font-weight="700">mean = 50</text><circle cx="47" cy="100" r="12" fill="#1E2B33"/><text x="47" y="140" font-family="Public Sans, Arial, sans-serif" font-size="22" fill="#1E2B33" text-anchor="middle">1</text><circle cx="177" cy="100" r="12" fill="#1E2B33"/><text x="177" y="140" font-family="Public Sans, Arial, sans-serif" font-size="22" fill="#1E2B33" text-anchor="middle">19</text><circle cx="443" cy="100" r="12" fill="#1E2B33"/><text x="443" y="140" font-family="Public Sans, Arial, sans-serif" font-size="22" fill="#1E2B33" text-anchor="middle">56</text><circle cx="609" cy="100" r="12" fill="#1E2B33"/><text x="609" y="140" font-family="Public Sans, Arial, sans-serif" font-size="22" fill="#1E2B33" text-anchor="middle">79</text><circle cx="724" cy="100" r="12" fill="#1E2B33"/><text x="724" y="140" font-family="Public Sans, Arial, sans-serif" font-size="22" fill="#1E2B33" text-anchor="middle">95</text></svg>