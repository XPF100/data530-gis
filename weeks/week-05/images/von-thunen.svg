<svg xmlns="http://www.w3.org/2000/svg" role="img" width="460" height="460" viewBox="0 0 460 460"><title>Von Thunen model: rings around a city, from market gardens and dairy closest, then forest, grain crops, and livestock grazing farthest out</title><rect width="460" height="460" fill="#FFFFFF"/><circle cx="230" cy="230" r="210" fill="#E3C79E"/><circle cx="230" cy="230" r="160" fill="#F5DDC2"/><circle cx="230" cy="230" r="110" fill="#8FB08A"/><circle cx="230" cy="230" r="65" fill="#D5E8E4"/><circle cx="230" cy="230" r="22" fill="#1E2B33"/><text x="230" y="236" font-family="Public Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#F7F5EF" text-anchor="middle">City</text><text x="230" y="190" font-family="Public Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E2B33" text-anchor="middle">Market gardens, dairy</text><text x="230" y="142" font-family="Public Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E2B33" text-anchor="middle">Forest (wood)</text><text x="230" y="95" font-family="Public Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E2B33" text-anchor="middle">Grain crops</text><text x="230" y="45" font-family="Public Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E2B33" text-anchor="middle">Livestock grazing</text></svg>